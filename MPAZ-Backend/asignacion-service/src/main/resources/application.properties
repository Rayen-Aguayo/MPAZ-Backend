spring.application.name=asignacion-service
server.port=9092

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_asignacion?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Servicio al que se le consultan las unidades
services.unidad.url=${UNIDAD_URL:http://localhost:9091}

# Muestra el mensaje de error en las respuestas (409, 400, 403...)
server.error.include-message=always
