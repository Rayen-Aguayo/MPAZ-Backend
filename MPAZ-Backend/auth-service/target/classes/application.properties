spring.application.name=auth-service
server.port=9094

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# Las tablas las crea Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

jwt.secret=${SECRET:mpaz-pro-2026-clave-secreta-jwt-xyz}
jwt.expiration-minutes=240

# Muestra el mensaje de error en las respuestas (409, 400, 403...)
server.error.include-message=always
