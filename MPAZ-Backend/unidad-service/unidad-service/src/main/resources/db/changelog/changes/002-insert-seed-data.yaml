databaseChangeLog:
  - changeSet:
      id: 002-insert-seed-data
      author: mpaz-team
      changes:
        - insert:
            tableName: unidades
            columns:
              - column: { name: asignatura, value: "Lenguaje y Comunicación" }
              - column: { name: titulo, value: "Comprendemos cuentos breves" }
              - column: { name: codigo_oa, value: "OA 3" }
              - column: { name: objetivo, value: "Comprender textos narrativos breves identificando personajes y acciones principales." }
              - column: { name: explicacion, value: "Un cuento tiene inicio, desarrollo y final. Los personajes realizan acciones en un lugar y tiempo determinados." }
              - column: { name: ejemplo, value: "En el cuento 'El zorro y el cuervo', el zorro elogia al cuervo para que suelte su queso." }
              - column: { name: instrucciones, value: "Lee con atención el relato y escucha el ejemplo antes de comenzar." }
              - column: { name: estado, value: "AUTORIZADA" }
              - column: { name: creador_id, valueNumeric: 1 }
        - insert:
            tableName: unidades
            columns:
              - column: { name: asignatura, value: "Matemática" }
              - column: { name: titulo, value: "Sumas y restas hasta el 100" }
              - column: { name: codigo_oa, value: "OA 9" }
              - column: { name: objetivo, value: "Demostrar que comprenden la adición y la sustracción en el ámbito del 0 al 100." }
              - column: { name: explicacion, value: "Para sumar números de dos cifras, primero sumamos las unidades y luego las decenas." }
              - column: { name: ejemplo, value: "24 + 13: sumamos 4 + 3 = 7 unidades y 2 + 1 = 3 decenas. Resultado: 37." }
              - column: { name: instrucciones, value: "Observa cómo se agrupan las unidades y decenas en el ejemplo guiado." }
              - column: { name: estado, value: "BORRADOR" }
              - column: { name: creador_id, valueNumeric: 1 }
