databaseChangeLog:
  - changeSet:
      id: 001-create-unidades-table
      author: mpaz-team
      changes:
        - createTable:
            tableName: unidades
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: asignatura
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: titulo
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: codigo_oa
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: objetivo
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: explicacion
                  type: VARCHAR(300)
                  constraints:
                    nullable: false
              - column:
                  name: ejemplo
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: instrucciones
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: imagen_uri
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: BORRADOR
                  constraints:
                    nullable: false
              - column:
                  name: creador_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: creada_en
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_unidades_estado
            tableName: unidades
            columns:
              - column:
                  name: estado
        - createIndex:
            indexName: idx_unidades_asignatura
            tableName: unidades
            columns:
              - column:
                  name: asignatura
