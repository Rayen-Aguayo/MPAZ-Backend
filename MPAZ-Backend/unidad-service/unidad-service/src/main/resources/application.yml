spring:
  application:
    name: unidad-service

  # Base de datos por defecto: H2 en memoria para ejecución local inmediata
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:unidaddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate (Liquibase gestiona el esquema)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8082}

# Clientes HTTP hacia otros microservicios
clients:
  usuario-service:
    url: ${USUARIO_SERVICE_URL:http://localhost:8081}
    enabled: ${USUARIO_SERVICE_ENABLED:false}
  asignacion-service:
    url: ${ASIGNACION_SERVICE_URL:http://localhost:8083}
    enabled: ${ASIGNACION_SERVICE_ENABLED:false}

---
# Perfil activo para despliegue con Docker Compose + PostgreSQL
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-unidad:5432/unidaddb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  h2:
    console:
      enabled: false

  jpa:
    show-sql: false
