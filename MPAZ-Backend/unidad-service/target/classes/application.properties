spring.application.name=unidad-service
server.port=9091

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_unidad?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# La imagen de apoyo puede ir como texto base64
server.tomcat.max-http-form-post-size=10MB

# Muestra el mensaje de error en las respuestas (409, 400, 403...)
server.error.include-message=always
