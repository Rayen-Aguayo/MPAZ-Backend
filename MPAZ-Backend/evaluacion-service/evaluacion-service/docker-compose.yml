services:
  postgres:
    image: postgres:16
    container_name: mpaz-evaluaciones-db
    environment:
      POSTGRES_DB: mpaz_evaluaciones
      POSTGRES_USER: mpaz
      POSTGRES_PASSWORD: mpaz
    ports:
      - "5432:5432"
    volumes:
      - evaluaciones_data:/var/lib/postgresql/data
volumes:
  evaluaciones_data:
