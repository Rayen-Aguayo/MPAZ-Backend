server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: evaluacion-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mpaz_evaluaciones}
    username: ${DB_USERNAME:mpaz}
    password: ${DB_PASSWORD:mpaz}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: America/Santiago
clients:
  unidad-service:
    url: ${UNIDAD_SERVICE_URL:http://localhost:8082}
  asignacion-service:
    url: ${ASIGNACION_SERVICE_URL:http://localhost:8083}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
