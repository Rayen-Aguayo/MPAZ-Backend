spring.application.name=evaluacion-service
server.port=9093

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_evaluacion?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Servicios que se consultan
services.unidad.url=${UNIDAD_URL:http://localhost:9091}
services.asignacion.url=${ASIGNACION_URL:http://localhost:9092}

# Muestra el mensaje de error en las respuestas (409, 400, 403...)
server.error.include-message=always
